name: Idea or feature request
description: Suggest something Outlawz could do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: principles
    attributes:
      label: Outlawz's principles
      options:
        - label: This keeps everything local by default (no accounts, no telemetry, no cloud services required).
          required: false
