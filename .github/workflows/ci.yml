name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: Types
        run: mypy
      - name: Tests (offline, with a fake model and embedder)
        run: pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  package:
    name: Package (wheel with the web app) and smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web app into the package
        run: python scripts/build_web.py
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build backend --outdir dist
      - name: The wheel contains the web app and samples
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("outlawz/web/index.html") for n in names), "web app missing"
          assert any("/samples/" in n for n in names), "samples missing"
          print(len(names), "files in the wheel")
          PY
      - name: Install the wheel and start it
        env:
          OUTLAWZ_LLM: fake
          OUTLAWZ_EMBEDDER: fake
          OUTLAWZ_RERANKER: lexical
          OUTLAWZ_DATA_DIR: ${{ runner.temp }}/outlawz-data
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/outlawz start --no-browser --port 8642 --library "$RUNNER_TEMP/library" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8642/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8642/ | grep -q "<html"
          curl -sf -o /dev/null http://127.0.0.1:8642/library/
          /tmp/smoke/bin/outlawz doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: outlawz:ci
      - name: The container starts and is healthy
        run: |
          docker run -d --name outlawz -p 127.0.0.1:8642:8642 \
            -e OUTLAWZ_LLM=fake -e OUTLAWZ_EMBEDDER=fake -e OUTLAWZ_RERANKER=lexical outlawz:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8642/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8642/ | grep -q "<html"
          test "$(docker exec outlawz id -u)" = "1000"
          docker logs outlawz

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
