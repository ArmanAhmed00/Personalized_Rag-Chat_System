# Install once with:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig\.json$
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend core)
        entry: bash -c 'cd backend && mypy'
        language: system
        pass_filenames: false
        files: ^backend/outlawz/.*\.py$
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|mjs)$
