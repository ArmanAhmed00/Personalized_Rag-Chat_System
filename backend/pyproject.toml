[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sidelamp"
dynamic = ["version"]
description = "Chat with your own documents on your own computer. Every answer cites the passage it came from."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arman Ahmed" }]
keywords = ["rag", "local-first", "privacy", "pdf", "epub", "csv", "llm", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anyio>=4.6",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "numpy>=1.26",
  "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "mypy>=1.13", "pre-commit>=4"]

[project.scripts]
sidelamp = "sidelamp.cli:main"

[project.urls]
Homepage = "https://github.com/ArmanAhmed00/Personalized_Rag-Chat_System"
Issues = "https://github.com/ArmanAhmed00/Personalized_Rag-Chat_System/issues"

[tool.hatch.version]
path = "sidelamp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sidelamp"]
# The built web app is gitignored, so it has to be listed explicitly.
artifacts = ["sidelamp/web/**"]

[tool.hatch.build.targets.sdist]
include = ["sidelamp", "tests", "README.md", "pyproject.toml"]
artifacts = ["sidelamp/web/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PIE", "RET"]
ignore = [
  "S101",   # assert is fine for internal invariants
  "S311",   # random is used for sampling, not security
  "SIM905", # word lists are easier to read as one string
  "RUF001", "RUF002", "RUF003",  # typographic characters in UI copy are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
files = ["sidelamp"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]
